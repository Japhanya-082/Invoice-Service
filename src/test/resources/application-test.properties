# ============================================================
# Test profile — overrides main application.properties
# Uses an in-memory H2 datasource so no real DB is required.
# ============================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=

# Disable Flyway for tests — schema is managed by Hibernate DDL
spring.flyway.enabled=false

# Disable Eureka discovery for tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.compatibility-verifier.enabled=false

# Mail stub (not actually used in unit tests)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test

# File upload dir (temp location for tests)
file.upload-dir=${java.io.tmpdir}/invoice-test-uploads

# JWT (same secret as production so filter tests work)
# TEST ONLY — not a real secret, do not use outside the test profile
jwt.secret=test-only-do-not-use-in-prod-test-only-do-not-use-in-prod-1234
jwt.expiration=86400000

