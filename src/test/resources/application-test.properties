# ============================================================
# Test profile — overrides main application.properties
# Uses an in-memory H2 datasource so no real DB is required.
# ============================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS invoice
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# H2 resolves ;SCHEMA= before the URL's INIT clause runs, so the schema cannot
# be pinned on the URL here. INIT creates it and Hibernate is pointed at it
# instead. Production is PostgreSQL and uses currentSchema on the URL, which is
# what tenant routing depends on -- this property is test-only and must not be
# copied into a real profile (it fully-qualifies every table name and would make
# routing inert).
spring.jpa.properties.hibernate.default_schema=invoice

# Disable Flyway for tests — schema is managed by Hibernate DDL.
# app.flyway.after-jpa must be disabled too: FlywayAfterJpaConfig re-runs Flyway
# from a SmartInitializingSingleton regardless of spring.flyway.enabled, and the
# migrations target the real PostgreSQL schema, not H2's Hibernate-generated one.
spring.flyway.enabled=false
app.flyway.after-jpa=false

spring.cloud.compatibility-verifier.enabled=false

# Mail stub (not actually used in unit tests)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=test

# File upload dir (temp location for tests)
file.upload-dir=${java.io.tmpdir}/invoice-test-uploads

# JWT (same secret as production so filter tests work)
# TEST ONLY — not a real secret, do not use outside the test profile
jwt.secret=test-only-do-not-use-in-prod-test-only-do-not-use-in-prod-1234
jwt.expiration=86400000

# JWT claim validation for tests (not secrets)
jwt.issuer=invoice-login
jwt.audience=invoice-platform
jwt.clock-skew-seconds=30
