spring.application.name=INVOICE-SERVICE

#spring.profiles.active=uatl
server.port=5671

# Increase read timeout for peer replication (default 5000ms)
eureka.server.peer-node-read-timeout-ms=10000

# Increase eviction interval
eureka.instance.lease-expiration-duration-in-seconds=90
eureka.instance.lease-renewal-interval-in-seconds=30

# Eureka registration
# ===========================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.cloud.compatibility-verifier.enabled=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===========================
# Database
# ===========================
spring.datasource.url=jdbc:postgresql://localhost:5432/Invoice
spring.datasource.username=postgres
spring.datasource.password=Lms@123$
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=invoice

# ===========================
# Flyway
# ===========================
spring.flyway.schemas=invoice
spring.flyway.baseline-on-migrate=true

customer.service.url=http://127.0.0.1:5679

