spring.application.name=INVOICE-SERVICE

spring.profiles.active=prod
server.port=5671

spring.cloud.compatibility-verifier.enabled=false

# Increase read timeout for peer replication (default 5000ms)

# Increase eviction interval


# JPA — let Hibernate auto-create/update tables before Flyway runs
spring.jpa.hibernate.ddl-auto=update

# Flyway — disabled here; FlywayAfterJpaConfig runs it after Hibernate DDL
spring.flyway.enabled=false
app.flyway.after-jpa=true
spring.flyway.schemas=invoice
spring.flyway.default-schema=invoice
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Per-module history table so Customer / Invoice / Reports do not fight over identically-numbered migrations.
spring.flyway.table=flyway_schema_history_invoice
# V007 was neutralized (its column renames conflicted with the JPA entity column
# names); skip checksum validation of already-applied migrations so startup does
# not fail on the changed script.
spring.flyway.validate-on-migrate=false

customer.service.url=${CUSTOMER_SERVICE_URL:http://customer:5679}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.resolve-lazily=true

# File upload directory (can be overridden by environment variable)
file.upload-dir=${UPLOAD_DIR:/var/www/html/Invoice_BE/uploads}


# Tesseract OCR

tesseract.datapath=C:\\tesseract
tesseract.language=eng

login.service.base-url=${LOGIN_SERVICE_URL:http://login:5678}

# JWT secret (must match Invoice-Login) — required env var, no fallback.
jwt.secret=${JWT_SECRET}
# 24 hours in ms
jwt.expiration=86400000


# Mail. Where invoice mail goes is an environment decision, as in the login
# service; the defaults are the values that were compiled in before, so a
# deployment that sets nothing behaves exactly as it did. The local stack sets
# MAIL_HOST=mailpit with auth, SSL and STARTTLS off -- with these hard-coded,
# every send authenticated against the sink and failed with "535 Incorrect
# authentication data" while the endpoint still reported success.
spring.mail.host=${MAIL_HOST:host.narveetech.com}
spring.mail.port=${MAIL_PORT:465}
# The Invoice application sends as invoice@mytrustin.com. The fallback used to
# name no-reply@singularanalysts.com, a mailbox this application does not own;
# with MAIL_USERNAME unset that is who the mail claimed to be from.
spring.mail.username=${MAIL_USERNAME:invoice@mytrustin.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.from=${MAIL_USERNAME:invoice@mytrustin.com}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000



# Empty default = "no internal key configured"; isTrustedInternalCall()
# fails closed on a blank value, so this is safe and is NOT a committed secret.
internal.api-key=${INTERNAL_API_KEY:}

# Actuator for health check
management.endpoints.web.exposure.include=*
logging.level.org.springframework.web=DEBUG
logging.level.com.example.controller=DEBUG

# --- JWT claim validation (not secrets; safe to default) -------------------
# Every consumer verifies these on every request. A token minted for another
# issuer or audience is rejected even when the signature is valid.
jwt.issuer=${JWT_ISSUER:invoice-login}
jwt.audience=${JWT_AUDIENCE:invoice-platform}
jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:30}

# --- Tenant routing (G-57) --------------------------------------------------
# true (default): a request that authenticated as a tenant user but whose token
# carries no companyDomain is refused with 503, because no schema can be
# selected for it. The invoice table has no admin_id column, so the router is
# this service's entire tenant boundary; serving such a request from the
# default datasource exposed every tenant's invoices.
# false: restores the old fail-open behaviour for the duration of an incident.
# No redeploy needed. Other tenants' invoices are reachable while it is off.
tenant.require-tenant=${TENANT_REQUIRE_TENANT:true}
