spring.application.name=INVOICE-SERVICE

spring.profiles.active=prod
server.port=5671

spring.cloud.compatibility-verifier.enabled=false

# Increase read timeout for peer replication (default 5000ms)

# Increase eviction interval


# JPA — let Hibernate auto-create/update tables before Flyway runs
spring.jpa.hibernate.ddl-auto=update

# Flyway — disabled here; FlywayAfterJpaConfig runs it after Hibernate DDL
spring.flyway.enabled=false
app.flyway.after-jpa=true
spring.flyway.schemas=invoice
spring.flyway.default-schema=invoice
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Per-module history table so Customer / Invoice / Reports do not fight over identically-numbered migrations.
spring.flyway.table=flyway_schema_history_invoice
# V007 was neutralized (its column renames conflicted with the JPA entity column
# names); skip checksum validation of already-applied migrations so startup does
# not fail on the changed script.
spring.flyway.validate-on-migrate=false

customer.service.url=${CUSTOMER_SERVICE_URL:http://customer:5679}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.resolve-lazily=true

# File upload directory (can be overridden by environment variable)
file.upload-dir=${UPLOAD_DIR:/var/www/html/Invoice_BE/uploads}


# Tesseract OCR

tesseract.datapath=C:\\tesseract
tesseract.language=eng

login.service.base-url=${LOGIN_SERVICE_URL:http://login:5678}

# JWT secret (must match Invoice-Login) — required env var, no fallback.
jwt.secret=${JWT_SECRET:8f2c9a6d1e4b7c3f5a0d9e2b6c8f1a4e7d0c3b5a9f2e6d1c4b7a8e0f3d5c2b1}
# 24 hours in ms
jwt.expiration=86400000


# Mail (optional)
spring.mail.host=host.narveetech.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:no-reply@narvee.com}
spring.mail.password=${MAIL_PASSWORD:4hi;lMs[,Yu66Zql}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.from=no-reply@narvee.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000



internal.api-key=${INTERNAL_API_KEY:invoice-internal-key-2026}

# Actuator for health check
management.endpoints.web.exposure.include=*
logging.level.org.springframework.web=DEBUG
logging.level.com.example.controller=DEBUG
