spring.application.name=INVOICE-SERVICE

# Dev file upload directory (relative inside project)
file.upload-dir=uploaded_files

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/Invoice
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Deliberately NO spring.jpa.properties.hibernate.default_schema.
# Setting it makes Hibernate fully-qualify every table (invoice.user_info),
# which overrides the currentSchema on each per-tenant connection pool and
# silently disables tenant routing. The default pool is pinned to the
# invoice schema in TenantDataSourceConfig instead.
